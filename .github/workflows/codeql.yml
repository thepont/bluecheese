name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

jobs:
  analyze:
    name: Analyze with CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Require positive controls for every custom query
        run: cargo test --locked --test codeql_coverage

      - uses: github/codeql-action/init@v4
        with:
          languages: java,javascript-typescript,rust
          queries: +./codeql/rust-smells,+./codeql/java-smells,+./codeql/javascript-smells

      - name: Test custom CodeQL queries
        run: >-
          codeql test run
          codeql/rust-smells-tests
          codeql/java-smells-tests
          codeql/javascript-smells-tests

      - uses: github/codeql-action/analyze@v4
